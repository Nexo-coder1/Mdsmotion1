<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDSmotionfx</title>
<meta name="description" content="">
<meta name="theme-color" content="#0b0b0c">
<style>
  :root {
    --bg: #0b0b0c; --bg-2: #141416; --surface: #1a1a1d; --line: rgba(255,255,255,.08);
    --text: #f2f2f2; --muted: #a3a3a8; --accent: #ff5a36;
    --radius-lg: 22px; --radius-md: 14px; --max: 1200px;
    --ease: cubic-bezier(.2,.7,.2,1);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
  img, video, iframe { display: block; max-width: 100%; height: auto; }
  iframe { width: 100%; height: 100%; border: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; font-weight: 700; letter-spacing: -0.02em; }
  h1 { font-size: clamp(2.2rem, 6vw, 4.4rem); }
  h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); }
  h3 { font-size: 1.2rem; }
  p { margin: 0 0 1em; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .container { width: min(100% - 40px, var(--max)); margin-inline: auto; }
  section { padding: clamp(60px, 9vw, 110px) 0; }
  .eyebrow { color: var(--accent); font-size: .85rem; text-transform: uppercase; letter-spacing: .14em; font-weight: 600; margin-bottom: .75rem; display: block; }
  .section-head { max-width: 680px; margin-bottom: 40px; }
  .center { text-align: center; margin-inline: auto; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: .95rem; border: 1px solid transparent; transition: transform .25s var(--ease), background .25s, border-color .25s, color .25s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { transform: translateY(-2px); background: #ff7050; }
  .btn-ghost { border-color: var(--line); color: var(--text); }
  .btn-ghost:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }

  /* Header */
  .site-header { position: fixed; inset: 0 0 auto 0; z-index: 100; background: rgba(11,11,12,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .nav { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; }
  .nav-links a { color: var(--muted); font-size: .95rem; transition: color .2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-cta { display: flex; align-items: center; gap: 12px; }
  .menu-toggle { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); align-items: center; justify-content: center; }
  .menu-toggle svg { width: 22px; height: 22px; }
  .mobile-menu { position: absolute; top: 72px; left: 0; right: 0; background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 12px 20px 24px; display: none; flex-direction: column; gap: 4px; }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { padding: 14px 4px; border-bottom: 1px solid var(--line); color: var(--text); }
  .mobile-menu .btn { margin-top: 16px; border-bottom: none; }

  /* Hero */
  .hero { padding-top: 150px; padding-bottom: 60px; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center; }
  .hero-lead { font-size: 1.1rem; max-width: 520px; margin-bottom: 32px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 36px; }
  .proof-line { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .95rem; }
  .proof-line strong { color: var(--text); }
  .proof-line a { color: var(--accent); font-weight: 600; }
  .collage { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .collage figure { margin: 0; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); aspect-ratio: 3/4; }
  .collage figure:nth-child(2), .collage figure:nth-child(3) { margin-top: 36px; }
  .collage figure:nth-child(3) { aspect-ratio: 4/3; }
  .collage figure:nth-child(4) { margin-top: -36px; }
  .collage img, .media img, .work-item img, .short-card img, .proof-card img, .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .collage figure img { transition: transform .6s var(--ease); }
  .collage figure:hover img { transform: scale(1.05); }
  .img-fail { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#222226,#151517); color: var(--muted); font-size: .85rem; text-align: center; padding: 12px; min-height: 100%; width: 100%; height: 100%; }
  .img-fail:empty::after { content: "Image not found"; }

  /* Work */
  .work-grid, .proof-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .work-item { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); aspect-ratio: 16/10; display: block; }
  .work-item img { transition: transform .6s var(--ease); }
  .work-item::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), transparent 55%); }
  .work-item:hover img { transform: scale(1.04); }
  .work-label { position: absolute; left: 20px; bottom: 18px; z-index: 2; font-weight: 600; }
  .subhead { margin: 80px 0 28px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .subhead h3 { font-size: 1.6rem; margin: 0; }
  .short-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .short-card { position: relative; aspect-ratio: 9/16; border-radius: var(--radius-md); overflow: hidden; background: var(--surface); border: 1px solid var(--line); padding: 0; width: 100%; transition: transform .3s var(--ease), border-color .3s; }
  .short-card:hover { transform: translateY(-4px); border-color: var(--accent); }
  .play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.14); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; color: #fff; border: 1px solid rgba(255,255,255,.25); }
  .play svg { width: 20px; height: 20px; margin-left: 3px; }

  /* Services */
  .services { background: var(--bg-2); }
  .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .service-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 36px; transition: transform .35s var(--ease), border-color .35s; }
  .service-card:hover { transform: translateY(-6px); border-color: rgba(255,90,54,.5); }
  .service-card .icon { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,90,54,.12); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .service-card .icon svg { width: 24px; height: 24px; }
  .service-card p { margin-bottom: 0; }
  .service-cta { margin-top: 40px; text-align: center; }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .skill-group { border-top: 1px solid var(--line); padding-top: 22px; }
  .skill-group h3 { color: var(--accent); font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; }
  .skill-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .skill-group li { color: var(--text); font-size: .98rem; }

  /* Testimonials */
  .testimonials { background: var(--bg-2); }
  .quote-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .quote { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 30px; display: flex; flex-direction: column; gap: 22px; margin: 0; }
  .quote blockquote { margin: 0; color: var(--text); font-size: .98rem; }
  .quote figcaption { display: flex; align-items: center; gap: 12px; margin-top: auto; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent); }
  .quote cite { font-style: normal; font-weight: 600; }

  /* Proof and extra sections */
  .proof-card { margin: 0; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); cursor: zoom-in; padding: 0; text-align: left; }
  .proof-card img { aspect-ratio: 4/3; }
  .proof-card figcaption { padding: 14px 18px; color: var(--text); font-size: .95rem; }
  .extra-media { margin-top: 30px; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
  .extra-media.video { aspect-ratio: 16/9; }

  /* FAQ */
  .faq-wrap { max-width: 820px; margin-inline: auto; }
  details { border-bottom: 1px solid var(--line); padding: 20px 4px; }
  details summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-weight: 600; font-size: 1.05rem; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; font-size: 1.5rem; color: var(--accent); line-height: 1; transition: transform .3s var(--ease); }
  details[open] summary::after { transform: rotate(45deg); }
  details p { margin: 14px 0 0; }

  /* CTA */
  .cta { text-align: center; }
  .cta h2 { max-width: 700px; margin-inline: auto; }
  .cta p { margin-inline: auto; max-width: 560px; }

  /* Footer */
  .site-footer { border-top: 1px solid var(--line); padding: 60px 0 30px; background: var(--bg-2); }
  .footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 40px; margin-bottom: 40px; }
  .footer-grid h4 { margin: 0 0 14px; font-size: .9rem; text-transform: uppercase; letter-spacing: .1em; }
  .footer-grid ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .footer-grid a, .footer-grid li { color: var(--muted); font-size: .95rem; transition: color .2s; }
  .footer-grid a:hover { color: var(--accent); }
  .footer-bottom { border-top: 1px solid var(--line); padding-top: 24px; color: var(--muted); font-size: .85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.visible { opacity: 1; transform: none; }

  /* Media modal */
  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal.open { display: flex; }
  .modal-inner { position: relative; max-width: min(100%, 900px); width: 100%; display: flex; align-items: center; justify-content: center; }
  .mbody { width: 100%; display: flex; align-items: center; justify-content: center; }
  .mbody img { max-height: 85vh; width: auto; max-width: 100%; border-radius: var(--radius-md); }
  .mbody .vertical { position: relative; height: min(85vh, 640px); aspect-ratio: 9/16; background: #000; border-radius: var(--radius-md); overflow: hidden; }
  .mbody .vertical video, .mbody .vertical iframe { width: 100%; height: 100%; object-fit: contain; }
  .mbody .wide { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .mbody p { color: var(--muted); text-align: center; }
  .modal-close { position: absolute; top: -48px; right: 0; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; border: none; font-size: 1.4rem; line-height: 1; }

  .fallback { padding: 160px 20px; text-align: center; color: var(--muted); }

  /* Responsive */
  @media (max-width: 1024px) {
    .short-grid { grid-template-columns: repeat(2, 1fr); }
    .skills-grid { grid-template-columns: 1fr; }
    .quote-grid { grid-template-columns: repeat(2, 1fr); }
    .footer-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 860px) {
    .nav-links, .nav-cta .btn { display: none; }
    .menu-toggle { display: inline-flex; }
    .hero { padding-top: 120px; }
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .service-grid, .work-grid, .proof-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .container { width: min(100% - 28px, var(--max)); }
    .quote-grid { grid-template-columns: 1fr; }
    .short-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .footer-grid { grid-template-columns: 1fr; }
    .collage figure:nth-child(2), .collage figure:nth-child(3), .collage figure:nth-child(4) { margin-top: 0; }
    .service-card { padding: 26px; }
    .btn { width: 100%; }
    .hero-actions { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div id="app"><p class="fallback">लोड हो रहा है…</p></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Media preview" hidden>
  <div class="modal-inner">
    <button class="modal-close" id="mClose" aria-label="Close">&times;</button>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var modal = document.getElementById("modal");
  var mBody = document.getElementById("mBody");
  var lastFocus = null;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ytEmbed(u) {
    var m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(u || "");
    return m ? "https://www.youtube.com/embed/" + m[1] : "";
  }
  function img(src, alt) {
    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : '<div class="img-fail"></div>';
  }
  function videoTag(src, cls) {
    var yt = ytEmbed(src);
    if (yt) return '<iframe src="' + esc(yt) + '" title="Video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    return '<video src="' + esc(src) + '" controls playsinline class="' + (cls || "") + '"></video>';
  }
  function sec(cls, inner, id) {
    return "<section" + (id ? ' id="' + id + '"' : "") + (cls ? ' class="' + cls + '"' : "") + '><div class="container">' + inner + "</div></section>";
  }
  function head(eyebrow, title, intro, center) {
    return '<div class="section-head reveal' + (center ? " center" : "") + '">' +
      (eyebrow ? '<span class="eyebrow">' + esc(eyebrow) + "</span>" : "") +
      "<h2>" + esc(title) + "</h2>" + (intro ? "<p>" + esc(intro) + "</p>" : "") + "</div>";
  }
  var ICONS = {
    reels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
    film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>'
  };
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>';

  function render(d) {
    var b = d.brand, h = d.hero || {};
    var wa = "https://wa.me/" + b.whatsapp + "?text=" + encodeURIComponent(b.whatsappMessage || "");
    function waBtn(label, cls) {
      return '<a class="btn ' + (cls || "btn-primary") + '" href="' + esc(wa) + '" target="_blank" rel="noopener">' + esc(label) + "</a>";
    }
    document.title = b.title || b.name;
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", b.description || "");

    var logo = esc(b.name).replace(/(motion)/i, "<span>$1</span>");
    var H = "";

    H += '<header class="site-header"><nav class="container nav" aria-label="Main navigation">' +
      '<a href="#top" class="logo">' + logo + '</a>' +
      '<ul class="nav-links"><li><a href="#work">Work</a></li><li><a href="#services">Services</a></li><li><a href="#testimonials">Testimonial</a></li><li><a href="#faq">FAQ</a></li></ul>' +
      '<div class="nav-cta">' + waBtn("Hire me") +
      '<button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>' +
      '</div></nav>' +
      '<div class="mobile-menu" id="mobileMenu"><a href="#work">Work</a><a href="#services">Services</a><a href="#testimonials">Testimonial</a><a href="#faq">FAQ</a>' + waBtn("Hire me") + "</div></header>";

    H += '<main id="top">';

    H += '<section class="hero"><div class="container hero-grid"><div class="reveal">' +
      (h.eyebrow ? '<span class="eyebrow">' + esc(h.eyebrow) + "</span>" : "") +
      "<h1>" + esc(h.title) + "</h1>" +
      '<p class="hero-lead">' + esc(h.lead) + "</p>" +
      '<div class="hero-actions">' + waBtn(h.primaryButton || "Let's chat") +
      '<a class="btn btn-ghost" href="#work">' + esc(h.secondaryButton || "See portfolio") + "</a></div>" +
      '<div class="proof-line"><strong>' + esc(h.proofText) + '</strong><a href="#testimonials">' + esc(h.testimonialsLink || "Read testimonials") + "</a></div>" +
      '</div><div class="collage reveal" aria-label="Selected edit previews">' +
      (h.images || []).map(function (x) { return "<figure>" + img(x.src, x.alt) + "</figure>"; }).join("") +
      "</div></div></section>";

    var w = d.work;
    if (w && w.projects && w.projects.length) {
      H += sec("", head("Portfolio", w.title, w.intro) +
        '<div class="work-grid">' + w.projects.map(function (p) {
          return '<a class="work-item reveal" href="' + esc(p.link || "#work") + '" aria-label="' + esc(p.title) + '">' + img(p.image, p.title) +
            '<span class="work-label">' + esc(p.title) + "</span></a>";
        }).join("") + "</div>", "work");
    }

    var s = d.shorts;
    if (s && s.items && s.items.length) {
      H += sec("", '<div class="subhead reveal"><h3>' + esc(s.title) + '</h3><span class="proof-line">' + esc(s.subtitle) + "</span></div>" +
        '<div class="short-grid">' + s.items.map(function (x) {
          return '<button class="short-card reveal" data-video="' + esc(x.video) + '" data-title="' + esc(x.title) + '">' + img(x.thumb, x.title) +
            '<span class="play">' + PLAY + "</span></button>";
        }).join("") + "</div>");
    }

    var sv = d.services;
    if (sv && sv.items && sv.items.length) {
      H += '<section id="services" class="services"><div class="container">' + head(sv.eyebrow, sv.title, sv.intro) +
        '<div class="service-grid">' + sv.items.map(function (x) {
          return '<article class="service-card reveal"><div class="icon" aria-hidden="true">' + (ICONS[x.icon] || "") + "</div><h3>" + esc(x.title) + "</h3><p>" + esc(x.text) + "</p></article>";
        }).join("") + "</div>" +
        (sv.button ? '<div class="service-cta reveal"><a class="btn btn-ghost" href="' + esc(b.instagramUrl) + '" target="_blank" rel="noopener">' + esc(sv.button) + "</a></div>" : "") +
        "</div></section>";
    }

    var sk = d.skills;
    if (sk && sk.groups && sk.groups.length) {
      H += sec("", head(sk.eyebrow, sk.title, sk.intro) +
        '<div class="skills-grid">' + sk.groups.map(function (g) {
          return '<div class="skill-group reveal"><h3>' + esc(g.title) + "</h3><ul>" +
            (g.items || []).map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul></div>";
        }).join("") + "</div>");
    }

    var t = d.testimonials;
    if (t && t.items && t.items.length) {
      H += '<section id="testimonials" class="testimonials"><div class="container">' + head(t.eyebrow, t.title, "") +
        '<div class="quote-grid">' + t.items.map(function (q) {
          var av = q.photo ? img(q.photo, q.name) : esc((q.name || "").charAt(0));
          return '<figure class="quote reveal"><blockquote>“' + esc(q.quote) + "”</blockquote><figcaption>" +
            '<span class="avatar">' + av + "</span><cite>" + esc(q.name) + "</cite></figcaption></figure>";
        }).join("") + "</div></div></section>";
    }

    var pr = d.proof;
    if (pr && pr.items && pr.items.length) {
      H += sec("", head(pr.eyebrow, pr.title, pr.intro) +
        '<div class="proof-grid">' + pr.items.map(function (x) {
          return '<figure class="proof-card reveal" data-img="' + esc(x.image) + '" data-title="' + esc(x.caption) + '" tabindex="0">' +
            img(x.image, x.caption) + "<figcaption>" + esc(x.caption) + "</figcaption></figure>";
        }).join("") + "</div>", "proof");
    }

    (d.extraSections || []).forEach(function (e) {
      var inner = head("", e.title, e.text);
      if (e.image) inner += '<div class="extra-media reveal">' + img(e.image, e.title) + "</div>";
      if (e.video) inner += '<div class="extra-media video reveal">' + videoTag(e.video) + "</div>";
      H += sec("", inner);
    });

    var f = d.faq;
    if (f && f.items && f.items.length) {
      H += '<section id="faq"><div class="container">' + head(f.eyebrow, f.title, "", true) +
        '<div class="faq-wrap reveal">' + f.items.map(function (q) {
          return "<details><summary>" + esc(q.q) + "</summary><p>" + esc(q.a) + "</p></details>";
        }).join("") + "</div></div></section>";
    }

    var c = d.cta;
    if (c) {
      H += '<section class="cta"><div class="container reveal"><span class="eyebrow">' + esc(c.eyebrow) + "</span><h2>" + esc(c.title) +
        "</h2><p>" + esc(c.text) + "</p>" + waBtn(c.button || "Let's chat") + "</div></section>";
    }

    H += "</main>";

    H += '<footer class="site-footer"><div class="container"><div class="footer-grid"><div>' +
      '<div class="logo" style="margin-bottom:12px;">' + logo + "</div><p>" + esc(b.tagline) + "</p></div>" +
      "<div><h4>Let's connect</h4><ul>" +
      '<li>Contact: <a href="tel:+' + esc(b.whatsapp) + '">' + esc(b.phone) + "</a></li>" +
      '<li>Email: <a href="mailto:' + esc(b.email) + '">' + esc(b.email) + "</a></li>" +
      '<li>Instagram: <a href="' + esc(b.footerInstagramUrl) + '" target="_blank" rel="noopener">' + esc(b.footerInstagramLabel) + "</a></li>" +
      "</ul></div><div><h4>Sections</h4><ul>" +
      '<li><a href="#work">Work</a></li><li><a href="#services">Services</a></li><li><a href="#testimonials">Testimonial</a></li><li><a href="#faq">FAQ</a></li>' +
      '</ul></div></div><div class="footer-bottom"><span>' + esc(b.copyright) + "</span><span>" + esc(b.creditText) +
      ' <a href="' + esc(b.creditUrl) + '" target="_blank" rel="noopener">' + esc(b.creditName) + "</a></span></div></div></footer>";

    app.innerHTML = H;
    observe();
  }

  var io = null;
  function observe() {
    var els = app.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      els.forEach(function (el) { el.classList.add("visible"); });
      return;
    }
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    els.forEach(function (el) { io.observe(el); });
  }

  function openMedia(html) {
    mBody.innerHTML = html;
    lastFocus = document.activeElement;
    modal.hidden = false;
    modal.classList.add("open");
    document.getElementById("mClose").focus();
  }
  function closeMedia() {
    var v = mBody.querySelector("video");
    if (v) v.pause();
    mBody.innerHTML = "";
    modal.classList.remove("open");
    modal.hidden = true;
    if (lastFocus) lastFocus.focus();
  }

  app.addEventListener("click", function (e) {
    var t = e.target;
    var tog = t.closest("#menuToggle");
    if (tog) {
      var m = document.getElementById("mobileMenu");
      var open = !m.classList.contains("open");
      m.classList.toggle("open", open);
      tog.setAttribute("aria-expanded", String(open));
      return;
    }
    if (t.closest("#mobileMenu a")) {
      document.getElementById("mobileMenu").classList.remove("open");
      return;
    }
    var sc = t.closest(".short-card");
    if (sc) {
      var src = sc.getAttribute("data-video");
      openMedia(src
        ? '<div class="vertical">' + videoTag(src, "") + "</div>"
        : "<p>" + esc(sc.getAttribute("data-title")) + ": video path is empty. Add it in admin.html.</p>");
      return;
    }
    var pc = t.closest(".proof-card");
    if (pc) openMedia('<img src="' + esc(pc.getAttribute("data-img")) + '" alt="' + esc(pc.getAttribute("data-title")) + '">');
  });
  app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".proof-card")) {
      e.preventDefault();
      e.target.click();
    }
  });
  document.getElementById("mClose").addEventListener("click", closeMedia);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeMedia(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal.classList.contains("open")) closeMedia();
  });

  /* Broken image: show a placeholder instead of a broken icon */
  document.addEventListener("error", function (e) {
    if (e.target.tagName === "IMG" && e.target.parentNode) {
      e.target.parentNode.classList.add("img-fail");
      e.target.remove();
    }
  }, true);

  fetch("content.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(render)
    .catch(function () {
      app.innerHTML = '<p class="fallback">content.json नहीं मिली। इसे index.html के साथ उसी फ़ोल्डर में रखें और site को GitHub Pages या local server से खोलें।</p>';
    });
})();
</script>
</body>
</html>
