<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDSmotionfx</title>
<meta name="description" content="">
<meta name="theme-color" content="#0b0b0c">
<style id="s-font"></style>
<style id="s-theme"></style>
<style id="s-custom"></style>
<style>
:root{--bg:#0b0b0c;--bg2:#141416;--surface:#1a1a1d;--text:#f2f2f2;--muted:#a3a3a8;--accent:#ff5a36;--line:rgba(255,255,255,.08);--radius:22px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--hfont:var(--font);--hs:1;--sec-pad:90px;--shadow:none;--btn-r:999px;--max:1200px;--ease:cubic-bezier(.2,.7,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
h1,h2,h3{font-family:var(--hfont);line-height:1.15;margin:0 0 .5em;font-weight:700;letter-spacing:-.02em}
h1{font-size:calc(clamp(2.2rem,6vw,4.4rem) * var(--hs))}
h2{font-size:calc(clamp(1.8rem,4vw,2.8rem) * var(--hs))}
h3{font-size:1.2rem}
p{margin:0 0 1em;color:var(--muted)}
img,video,iframe{display:block;max-width:100%;height:auto}
iframe{width:100%;height:100%;border:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.container{width:min(100% - 40px,var(--max));margin-inline:auto}
.sec{padding:var(--sec-pad) 0}
.sec.alt{background:var(--bg2)}
.sec.hero{padding-top:150px}
.eyebrow{display:block;color:var(--accent);font-size:.85rem;text-transform:uppercase;letter-spacing:.14em;font-weight:600;margin-bottom:.75rem}
.head{max-width:680px;margin-bottom:40px}
.head.c{text-align:center;margin-inline:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:var(--btn-r);font-weight:600;font-size:.95rem;border:1px solid transparent;transition:transform .25s var(--ease),filter .25s,border-color .25s,color .25s}
.btn.main{background:var(--accent);color:#fff}
.btn.main:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn.ghost:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}
.hdr{position:fixed;inset:0 0 auto 0;z-index:100;background:var(--bg);opacity:.96;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.links{display:flex;gap:28px;list-style:none;margin:0;padding:0}
.links a{color:var(--muted);font-size:.95rem;transition:color .2s}
.links a:hover{color:var(--text)}
.ncta{display:flex;align-items:center;gap:12px}
.ham{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);align-items:center;justify-content:center}
.ham svg{width:22px;height:22px}
.mnu{display:none;position:absolute;top:72px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 20px 24px;flex-direction:column;gap:4px}
.mnu.open{display:flex}
.mnu a{padding:14px 4px;border-bottom:1px solid var(--line);color:var(--text)}
.mnu .btn{margin-top:16px;border-bottom:none}
.hgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.lead{font-size:1.1rem;max-width:520px;margin-bottom:32px}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:36px}
.note{color:var(--muted);font-size:.95rem}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.collage figure{margin:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);aspect-ratio:3/4}
.collage figure:nth-child(2),.collage figure:nth-child(3){margin-top:36px}
.collage figure:nth-child(3){aspect-ratio:4/3}
.collage figure:nth-child(4){margin-top:-36px}
.collage figure img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.collage figure:hover img{transform:scale(1.05)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:36px;box-shadow:var(--shadow);transition:transform .35s var(--ease),border-color .35s}
.card:hover{transform:translateY(-6px);border-color:var(--accent)}
.card p{margin:0}
.ico{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:22px;border:1px solid var(--line)}
.ico svg{width:24px;height:24px}
.tile{position:relative;display:block;border-radius:var(--radius);overflow:hidden;background:var(--surface);aspect-ratio:16/10;box-shadow:var(--shadow)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.tile:hover img{transform:scale(1.04)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%)}
.tlabel{position:absolute;left:20px;bottom:18px;z-index:2;font-weight:600}
.subhead{margin:80px 0 28px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.subhead h3{font-size:1.6rem;margin:0}
.short{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);padding:0;width:100%;box-shadow:var(--shadow);transition:transform .3s var(--ease),border-color .3s}
.short:hover{transform:translateY(-4px);border-color:var(--accent)}
.short img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255,255,255,.25)}
.play svg{width:20px;height:20px;margin-left:3px}
.sk{border-top:1px solid var(--line);padding-top:22px}
.sk h3{color:var(--accent);font-size:1rem;text-transform:uppercase;letter-spacing:.08em}
.sk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sk li{font-size:.98rem}
.quote{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:30px;display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow)}
.quote blockquote{margin:0;color:var(--text);font-size:.98rem}
.quote figcaption{display:flex;align-items:center;gap:12px;margin-top:auto}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
.quote cite{font-style:normal;font-weight:600}
.pcard{margin:0;border-radius:var(--radius);overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:zoom-in;padding:0;text-align:left;color:inherit;box-shadow:var(--shadow)}
.pcard img{aspect-ratio:4/3;width:100%;height:100%;object-fit:cover}
.pcard figcaption{padding:14px 18px;color:var(--text);font-size:.95rem}
.faq{max-width:820px;margin-inline:auto}
details{border-bottom:1px solid var(--line);padding:20px 4px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:600;font-size:1.05rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;color:var(--accent);line-height:1;transition:transform .3s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:14px 0 0}
.cta{text-align:center}
.cta p{margin-inline:auto;max-width:560px}
.mblock{border-radius:var(--radius);overflow:hidden;background:var(--surface);margin-top:30px;box-shadow:var(--shadow)}
.mblock.v{aspect-ratio:16/9}
.mblock video{width:100%;height:100%;object-fit:contain;background:#000}
.mblock.v iframe{width:100%;height:100%}
.ftr{border-top:1px solid var(--line);padding:60px 0 30px;background:var(--bg2)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;margin-bottom:40px}
.fgrid h4{margin:0 0 14px;font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
.fgrid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.fgrid a,.fgrid li{color:var(--muted);font-size:.95rem}
.fgrid a:hover{color:var(--accent)}
.fbot{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.img-fail{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#222226,#151517);color:var(--muted);font-size:.85rem;text-align:center;padding:12px;width:100%;height:100%;min-height:100%}
.img-fail:empty::after{content:"Image not found"}

/* Section animations. Values come from inline CSS variables set per section (content.json). */
.rv{opacity:0;transform:var(--from);transition:opacity var(--an-dur,600ms) var(--an-ease,ease) var(--an-delay,0ms),transform var(--an-dur,600ms) var(--an-ease,ease) var(--an-delay,0ms)}
.rv.in{opacity:1;transform:none}
.rv[data-anim="fade"]{--from:none}
.rv[data-anim="fade-up"]{--from:translateY(var(--an-dist,30px))}
.rv[data-anim="pop-up"]{--from:scale(var(--an-scale,.9))}
.rv[data-anim="scale-in"]{--from:scale(var(--an-scale,.9))}
.rv[data-anim="slide-left"]{--from:translateX(calc(var(--an-dist,30px) * -1))}
.rv[data-anim="slide-right"]{--from:translateX(var(--an-dist,30px))}
.rv[data-anim="none"]{opacity:1;transform:none;transition:none}

.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{position:relative;width:min(100%,900px);display:flex;justify-content:center}
.mbox img{max-height:85vh;max-width:100%;border-radius:14px}
.mbox .vert{height:min(85vh,640px);aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
.mbox .vert video,.mbox .vert iframe{width:100%;height:100%;object-fit:contain}
.mx{position:absolute;top:-48px;right:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:1.4rem;line-height:1}
.fallback{padding:160px 20px;text-align:center;color:var(--muted)}
@media(max-width:1024px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr 1fr}}
@media(max-width:860px){.links,.ncta .btn{display:none}.ham{display:inline-flex}.hgrid{grid-template-columns:1fr;gap:40px}.sec.hero{padding-top:120px}.grid2{grid-template-columns:1fr}}
@media(max-width:600px){.container{width:min(100% - 28px,var(--max))}.sec{padding:calc(var(--sec-pad) * .7) 0}.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr);gap:12px}.fgrid{grid-template-columns:1fr}.card{padding:26px}.btn{width:100%}.actions{flex-direction:column}.collage figure:nth-child(n){margin-top:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.rv{opacity:1!important;transform:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><p class="fallback">Loading...</p></div>

<div class="modal" id="modal" hidden>
  <div class="mbox">
    <button class="mx" id="mx" aria-label="Close">&times;</button>
    <div id="mb" style="width:100%;display:flex;justify-content:center"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var modal = document.getElementById("modal");
  var mb = document.getElementById("mb");
  var PREVIEW = /[?&]preview=1/.test(location.search);
  var BLOBS = {};
  var io = null, lastFocus = null;

  var ANCH = { cards: "work", services: "services", testimonials: "testimonials", faq: "faq", gallery: "proof" };
  var NAVL = { cards: "Work", services: "Services", testimonials: "Testimonial", faq: "FAQ" };
  var ICON = {
    reels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
    film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>'
  };
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>';
  var EASE = {
    "ease-out": "cubic-bezier(0.22,1,0.36,1)",
    "ease-in-out": "cubic-bezier(0.65,0,0.35,1)",
    "spring": "cubic-bezier(0.34,1.56,0.64,1)",
    "linear": "linear"
  };
  var SHADOW = { none: "none", soft: "0 10px 30px rgba(0,0,0,.25)", strong: "0 20px 60px rgba(0,0,0,.5)" };
  var BTN_R = { pill: "999px", rounded: "14px", square: "4px" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v, d) { var n = Number(v); return isFinite(n) && v !== "" && v != null ? n : d; }
  function src(p) { if (!p) return ""; return BLOBS[p] || p; }

  /* Turns a link into an embeddable player URL. Returns "" for uploaded files. */
  function embedUrl(p) {
    p = p || "";
    var m;
    m = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/.exec(p);
    if (m) return "https://www.youtube.com/embed/" + m[1];
    m = /instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/.exec(p);
    if (m) return "https://www.instagram.com/" + (m[1] === "reels" ? "reel" : m[1]) + "/" + m[2] + "/embed/";
    m = /drive\.google\.com\/file\/d\/([\w-]+)/.exec(p) || /drive\.google\.com\/open\?id=([\w-]+)/.exec(p);
    if (m) return "https://drive.google.com/file/d/" + m[1] + "/preview";
    return "";
  }

  function img(p, alt) { var s = src(p); return s ? '<img src="' + esc(s) + '" alt="' + esc(alt) + '" loading="lazy">' : '<div class="img-fail"></div>'; }

  function vid(p) {
    if (!p) return "";
    var e = embedUrl(p);
    if (e) return '<iframe src="' + esc(e) + '" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>';
    return '<video src="' + esc(src(p)) + '" controls playsinline preload="metadata"></video>';
  }

  /* Animation settings. Accepts the old string format too, so existing content.json keeps working. */
  function animOf(s) {
    var big = s.type === "hero" || s.type === "cta";
    var a = s.animation;
    if (typeof a === "string") a = { type: a };
    a = a || {};
    var type = a.type || (big ? "pop-up" : "fade-up");
    return {
      type: type,
      duration: num(a.duration, big ? 700 : 600),
      delay: num(a.delay, 0),
      distance: num(a.distance, 30),
      scale: num(a.scale, 0.9),
      easing: a.easing || (type === "pop-up" ? "spring" : "ease-out"),
      trigger: a.trigger === "load" ? "load" : "scroll",
      replay: !!a.replay
    };
  }

  function wa(c) { return "https://wa.me/" + c.brand.whatsapp + "?text=" + encodeURIComponent(c.brand.whatsappMessage || ""); }
  function btn(label, url, cls, c) {
    if (!label) return "";
    var h = url || wa(c), ext = /^https?:/.test(h);
    return '<a class="btn ' + (cls || "main") + '" href="' + esc(h) + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + esc(label) + "</a>";
  }
  function head(s, center) {
    var h = '<div class="head' + (center ? " c" : "") + '">';
    if (s.subtitle) h += '<span class="eyebrow">' + esc(s.subtitle) + "</span>";
    if (s.title) h += "<h2>" + esc(s.title) + "</h2>";
    if (s.text) h += "<p>" + esc(s.text) + "</p>";
    return h + "</div>";
  }
  function wrap(s, inner, extra) {
    var id = ANCH[s.type], A = animOf(s);
    var style = "--an-dur:" + A.duration + "ms;--an-delay:" + A.delay + "ms;--an-dist:" + A.distance + "px;--an-scale:" + A.scale + ";--an-ease:" + (EASE[A.easing] || EASE["ease-out"]) + ";";
    return '<section' + (id ? ' id="' + id + '"' : "") + ' class="sec rv' + (s.bg === "alt" ? " alt" : "") + (extra ? " " + extra : "") +
      '" data-anim="' + esc(A.type) + '" data-trigger="' + A.trigger + '" data-replay="' + (A.replay ? "1" : "0") + '" style="' + style + '"><div class="container">' + inner + "</div></section>";
  }
  function items(s) { return s.items || []; }

  var R = {
    hero: function (s, c) {
      return '<div class="hgrid"><div>' + (s.subtitle ? '<span class="eyebrow">' + esc(s.subtitle) + "</span>" : "") +
        "<h1>" + esc(s.title) + "</h1>" + (s.text ? '<p class="lead">' + esc(s.text) + "</p>" : "") +
        '<div class="actions">' + btn(s.button, s.buttonUrl, "main", c) + (s.button2 ? '<a class="btn ghost" href="#work">' + esc(s.button2) + "</a>" : "") + "</div>" +
        (s.note ? '<div class="note">' + esc(s.note) + "</div>" : "") + '</div><div class="collage">' +
        items(s).map(function (it) { return "<figure>" + img(it.image, it.title) + "</figure>"; }).join("") + "</div></div>";
    },
    cards: function (s) {
      return head(s) + '<div class="grid2">' + items(s).map(function (it) {
        return '<a class="tile" href="' + esc(it.link || "#work") + '" aria-label="' + esc(it.title) + '">' + img(it.image, it.title) +
          '<span class="tlabel">' + esc(it.title) + "</span></a>";
      }).join("") + "</div>";
    },
    shorts: function (s) {
      return '<div class="subhead"><h3>' + esc(s.title) + "</h3>" + (s.subtitle ? '<span class="note">' + esc(s.subtitle) + "</span>" : "") + "</div>" +
        '<div class="grid4">' + items(s).map(function (it) {
          return '<button class="short" data-video="' + esc(it.video) + '" data-title="' + esc(it.title) + '">' + img(it.image, it.title) +
            '<span class="play">' + PLAY + "</span></button>";
        }).join("") + "</div>";
    },
    services: function (s, c) {
      return head(s) + '<div class="grid2">' + items(s).map(function (it) {
        return '<article class="card"><div class="ico">' + (ICON[it.icon] || ICON.reels) + "</div><h3>" + esc(it.title) + "</h3><p>" + esc(it.text) + "</p></article>";
      }).join("") + "</div>" + (s.button ? '<div style="margin-top:40px;text-align:center">' + btn(s.button, s.buttonUrl || c.brand.instagramUrl, "ghost", c) + "</div>" : "");
    },
    skills: function (s) {
      return head(s) + '<div class="grid3">' + items(s).map(function (it) {
        return '<div class="sk"><h3>' + esc(it.title) + "</h3><ul>" +
          String(it.text || "").split(",").map(function (x) { return x.trim(); }).filter(Boolean).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
          "</ul></div>";
      }).join("") + "</div>";
    },
    testimonials: function (s) {
      return head(s) + '<div class="grid3">' + items(s).map(function (it) {
        var av = it.image ? img(it.image, it.title) : esc(String(it.title || "").charAt(0));
        return '<figure class="quote"><blockquote>“' + esc(it.text) + "”</blockquote><figcaption><span class=\"av\">" + av + "</span><cite>" + esc(it.title) + "</cite></figcaption></figure>";
      }).join("") + "</div>";
    },
    gallery: function (s) {
      return head(s) + '<div class="grid2">' + items(s).map(function (it) {
        return '<figure class="pcard" data-img="' + esc(it.image) + '" data-title="' + esc(it.title) + '" tabindex="0">' + img(it.image, it.title) +
          "<figcaption>" + esc(it.title) + "</figcaption></figure>";
      }).join("") + "</div>";
    },
    media: function (s) {
      var out = head(s);
      if (s.image) out += '<div class="mblock">' + img(s.image, s.title) + "</div>";
      if (s.video) out += '<div class="mblock v">' + vid(s.video) + "</div>";
      return out;
    },
    faq: function (s) {
      return head(s, true) + '<div class="faq">' + items(s).map(function (it) {
        return "<details><summary>" + esc(it.title) + "</summary><p>" + esc(it.text) + "</p></details>";
      }).join("") + "</div>";
    },
    cta: function (s, c) {
      return '<div class="cta">' + (s.subtitle ? '<span class="eyebrow">' + esc(s.subtitle) + "</span>" : "") +
        "<h2>" + esc(s.title) + "</h2>" + (s.text ? "<p>" + esc(s.text) + "</p>" : "") + btn(s.button, s.buttonUrl, "main", c) + "</div>";
    }
  };

  /* Old content.json format (before sections) is converted here so the site keeps working. */
  function normalize(o) {
    o = o || {};
    if (Array.isArray(o.sections)) { o.theme = o.theme || {}; return o; }
    var n = { brand: o.brand || {}, theme: o.theme || {}, sections: [] };
    var id = 0;
    function add(type, p) {
      var s = { id: "x" + (id++), type: type, visible: true, animation: null, bg: "default", subtitle: "", title: "", text: "", note: "", button: "", button2: "", buttonUrl: "", image: "", video: "", items: [] };
      Object.keys(p).forEach(function (k) { s[k] = p[k]; });
      n.sections.push(s);
    }
    var h = o.hero || {};
    add("hero", { subtitle: h.eyebrow, title: h.title, text: h.lead, button: h.primaryButton, button2: h.secondaryButton, note: h.proofText,
      items: (h.images || []).map(function (x) { return { image: x.src, title: x.alt }; }) });
    var w = o.work || {};
    if (w.projects) add("cards", { title: w.title, text: w.intro, items: w.projects });
    var sh = o.shorts || {};
    if (sh.items) add("shorts", { title: sh.title, subtitle: sh.subtitle, items: sh.items.map(function (x) { return { title: x.title, image: x.thumb, video: x.video }; }) });
    var sv = o.services || {};
    if (sv.items) add("services", { subtitle: sv.eyebrow, title: sv.title, text: sv.intro, button: sv.button, items: sv.items });
    var sk = o.skills || {};
    if (sk.groups) add("skills", { subtitle: sk.eyebrow, title: sk.title, text: sk.intro, items: sk.groups.map(function (g) { return { title: g.title, text: (g.items || []).join(", ") }; }) });
    var t = o.testimonials || {};
    if (t.items) add("testimonials", { subtitle: t.eyebrow, title: t.title, items: t.items.map(function (x) { return { title: x.name, text: x.quote, image: x.photo }; }) });
    var p = o.proof || {};
    if (p.items && p.items.length) add("gallery", { subtitle: p.eyebrow, title: p.title, text: p.intro, items: p.items.map(function (x) { return { image: x.image, title: x.caption }; }) });
    (o.extraSections || []).forEach(function (e) { add("media", { title: e.title, text: e.text, image: e.image, video: e.video }); });
    var f = o.faq || {};
    if (f.items) add("faq", { subtitle: f.eyebrow, title: f.title, items: f.items.map(function (x) { return { title: x.q, text: x.a }; }) });
    var c = o.cta || {};
    if (c.title) add("cta", { subtitle: c.eyebrow, title: c.title, text: c.text, button: c.button });
    return n;
  }

  function loadGoogle(name) {
    var id = "gf-" + name.replace(/\s+/g, "-");
    if (document.getElementById(id)) return;
    var l = document.createElement("link");
    l.id = id; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(name).replace(/%20/g, "+") + ":wght@400;600;700;800&display=swap";
    document.head.appendChild(l);
  }
  function famOf(name, file) {
    if (file) return '"CustomBody", system-ui, sans-serif';
    if (!name || name === "system") return 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    loadGoogle(name);
    return '"' + name + '", system-ui, sans-serif';
  }

  function applyTheme(t) {
    var r = document.documentElement.style;
    var map = { bg: "--bg", bg2: "--bg2", surface: "--surface", text: "--text", muted: "--muted", accent: "--accent" };
    Object.keys(map).forEach(function (k) { if (t[k]) r.setProperty(map[k], t[k]); });
    r.setProperty("--radius", (t.radius == null ? 22 : t.radius) + "px");
    r.setProperty("--sec-pad", (t.sectionSpacing == null ? 90 : t.sectionSpacing) + "px");
    r.setProperty("--hs", t.headingScale == null ? 1 : t.headingScale);
    r.setProperty("--shadow", SHADOW[t.shadow] || SHADOW.none);
    r.setProperty("--btn-r", BTN_R[t.buttonStyle] || BTN_R.pill);
    r.setProperty("--font", famOf(t.font, t.fontFile));
    r.setProperty("--hfont", t.headingFont ? famOf(t.headingFont, "") : "var(--font)");
    document.getElementById("s-font").textContent = t.fontFile
      ? '@font-face{font-family:"CustomBody";src:url("' + src(t.fontFile).replace(/"/g, "") + '")}' : "";
    document.getElementById("s-custom").textContent = t.customCss || "";
  }

  function render(raw, blobs) {
    BLOBS = blobs || {};
    var c = normalize(raw);
    applyTheme(c.theme || {});
    var secs = (c.sections || []).filter(function (s) { return s.visible !== false && R[s.type]; });
    var navs = secs.filter(function (s) { return NAVL[s.type]; })
      .map(function (s) { return '<li><a href="#' + ANCH[s.type] + '">' + NAVL[s.type] + "</a></li>"; }).join("");
    var logo = esc(c.brand.name || "").replace(/(motion)/i, "<span>$1</span>");
    var html = '<header class="hdr"><nav class="container nav" aria-label="Main menu"><a href="#top" class="logo">' + logo + '</a>' +
      '<ul class="links">' + navs + '</ul><div class="ncta">' + btn("Hire me", "", "main", c) +
      '<button class="ham" id="ham" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>' +
      '</div></nav><div class="mnu" id="mnu">' + navs.replace(/<li>/g, "").replace(/<\/li>/g, "") + btn("Hire me", "", "main", c) + "</div></header>";
    html += '<main id="top">';
    secs.forEach(function (s) { html += wrap(s, R[s.type](s, c), s.type === "hero" ? "hero" : ""); });
    html += "</main>";
    html += '<footer class="ftr"><div class="container"><div class="fgrid"><div><div class="logo" style="margin-bottom:12px">' + logo + "</div><p>" + esc(c.brand.tagline || "") + "</p></div>" +
      "<div><h4>Contact</h4><ul>" +
      (c.brand.phone ? '<li>Contact: <a href="tel:+' + esc(c.brand.whatsapp) + '">' + esc(c.brand.phone) + "</a></li>" : "") +
      (c.brand.email ? '<li>Email: <a href="mailto:' + esc(c.brand.email) + '">' + esc(c.brand.email) + "</a></li>" : "") +
      (c.brand.footerInstagramUrl ? '<li>Instagram: <a href="' + esc(c.brand.footerInstagramUrl) + '" target="_blank" rel="noopener">' + esc(c.brand.footerInstagramLabel || "Instagram") + "</a></li>" : "") +
      '</ul></div><div><h4>Sections</h4><ul>' + navs + '</ul></div></div><div class="fbot"><span>' + esc(c.brand.copyright || "") + "</span>" +
      "<span>" + esc(c.brand.creditText || "") + (c.brand.creditUrl ? ' <a href="' + esc(c.brand.creditUrl) + '" target="_blank" rel="noopener">' + esc(c.brand.creditName || "") + "</a>" : "") + "</span></div></div></footer>";
    app.innerHTML = html;
    observe();
  }

  /* Applies each section's trigger: "load" shows right away, "scroll" waits until it enters the viewport.
     With replay on, the section animates again each time it re-enters. */
  function observe() {
    if (io) { io.disconnect(); io = null; }
    var els = app.querySelectorAll(".rv");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!("IntersectionObserver" in window) || reduced) {
      els.forEach(function (e) { e.classList.add("in"); });
      return;
    }
    var scrollEls = [];
    els.forEach(function (e) {
      if (e.getAttribute("data-trigger") === "load") {
        requestAnimationFrame(function () { e.classList.add("in"); });
      } else {
        scrollEls.push(e);
      }
    });
    if (!scrollEls.length) return;
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var replay = en.target.getAttribute("data-replay") === "1";
        if (en.isIntersecting) {
          en.target.classList.add("in");
          if (!replay) io.unobserve(en.target);
        } else if (replay) {
          en.target.classList.remove("in");
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    scrollEls.forEach(function (e) { io.observe(e); });
  }

  function openMedia(html) {
    mb.innerHTML = html;
    lastFocus = document.activeElement;
    modal.hidden = false; modal.classList.add("open");
    document.getElementById("mx").focus();
  }
  function closeMedia() {
    var v = mb.querySelector("video"); if (v) v.pause();
    mb.innerHTML = "";
    modal.classList.remove("open"); modal.hidden = true;
    if (lastFocus) lastFocus.focus();
  }

  app.addEventListener("click", function (e) {
    var t = e.target;
    var ham = t.closest("#ham");
    if (ham) {
      var m = document.getElementById("mnu");
      var open = !m.classList.contains("open");
      m.classList.toggle("open", open);
      ham.setAttribute("aria-expanded", String(open));
      return;
    }
    if (t.closest("#mnu a")) { document.getElementById("mnu").classList.remove("open"); return; }
    var sc = t.closest(".short");
    if (sc) {
      var v = sc.getAttribute("data-video");
      openMedia(v ? '<div class="vert">' + vid(v) + "</div>" : '<p style="color:#a3a3a8">No video link or file path has been added for this item yet.</p>');
      return;
    }
    var pc = t.closest(".pcard");
    if (pc) openMedia('<img src="' + esc(src(pc.getAttribute("data-img"))) + '" alt="' + esc(pc.getAttribute("data-title")) + '">');
  });
  app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".pcard")) { e.preventDefault(); e.target.click(); }
  });
  document.getElementById("mx").addEventListener("click", closeMedia);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeMedia(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && modal.classList.contains("open")) closeMedia(); });

  document.addEventListener("error", function (e) {
    if (e.target.tagName === "IMG" && e.target.parentNode) {
      e.target.parentNode.classList.add("img-fail");
      e.target.remove();
    }
  }, true);

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "render") render(e.data.content, e.data.blobs);
  });

  if (PREVIEW) {
    if (window.parent !== window) window.parent.postMessage({ type: "ready" }, "*");
  } else {
    fetch("content.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
      .then(function (j) { render(j, {}); })
      .catch(function () {
        app.innerHTML = '<p class="fallback">content.json was not found. Keep it in the same folder as index.html and open the site from the GitHub Pages link.</p>';
      });
  }
})();
</script>
</body>
</html>
